<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mentoria TS — Tonho 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --surface2:#263447;
      --border:  #2d3f55;
      --blue:    #3b82f6;
      --blue-dk: #1d4ed8;
      --blue-lt: #93c5fd;
      --teal:    #22d3ee;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --pos:     #4ade80;
      --warn:    #fbbf24;
      --neg:     #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }

    /* Header */
    header {
      background: #0a1120;
      border-bottom: 1px solid var(--border);
      padding: 0 28px; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-name  { font-size: .95rem; font-weight: 700; color: var(--blue); letter-spacing: .04em; }
    .brand-sep   { color: var(--border); }
    .brand-event { font-size: .9rem; font-weight: 500; color: var(--text); }

    .hdr-r { display: flex; align-items: center; gap: 10px; }
    #badge { display: flex; align-items: center; gap: 6px; font-size: .72rem; color: var(--muted); }
    #dot   { width: 7px; height: 7px; border-radius: 50%; background: var(--pos); animation: blink 2s infinite; }
    #dot.stale { background: var(--warn); animation: none; }
    #dot.error { background: var(--neg);  animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    #btn {
      background: var(--blue-dk); color: #fff;
      border: none; border-radius: 5px; padding: 5px 13px;
      font-size: .74rem; cursor: pointer;
      transition: background .2s;
    }
    #btn:hover    { background: var(--blue); }
    #btn:disabled { opacity: .4; cursor: default; }

    /* Layout */
    main { padding: 22px 28px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    /* KPIs */
    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .kpi  {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px 18px;
      border-left: 3px solid var(--accent, var(--blue));
    }
    .kpi-lbl { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
    .kpi-val { font-size: 1.9rem; font-weight: 700; color: var(--accent, var(--blue)); line-height: 1; }
    .kpi-sub { font-size: .68rem; color: var(--muted); margin-top: 5px; }

    /* Content grid */
    .row2 { display: grid; grid-template-columns: 380px 1fr; gap: 16px; }
    @media (max-width: 900px) { .row2 { grid-template-columns: 1fr; } }

    /* Card */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .card-hdr {
      background: var(--blue-dk); padding: 10px 16px;
    }
    .card-hdr h3 { font-size: .78rem; font-weight: 600; letter-spacing: .04em; color: #fff; }
    .card-body { padding: 16px; }
    .card-body canvas { max-height: 220px; }

    /* Table */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .78rem; }
    thead th {
      background: var(--blue-dk); padding: 9px 14px;
      text-align: left; font-size: .69rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; color: #dbeafe;
      white-space: nowrap;
    }
    thead th.r { text-align: right; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 9px 14px; color: var(--text); }
    tbody td.r { text-align: right; font-variant-numeric: tabular-nums; color: var(--blue-lt); }
    .empty { text-align: center; padding: 28px; color: var(--muted); font-size: .78rem; }

    /* Loading */
    #loading {
      position: fixed; inset: 0; background: rgba(10,17,32,.93);
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; color: var(--muted); z-index: 100;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>

<div id="loading">Carregando dados...</div>

<header>
  <div class="brand">
    <span class="brand-name">tradestars</span>
    <span class="brand-sep">|</span>
    <span class="brand-event">Mentoria Tonho 2026</span>
  </div>
  <div class="hdr-r">
    <div id="badge"><div id="dot"></div><span id="status-txt">Atualizando...</span></div>
    <button id="btn" onclick="load(true)">↻ Atualizar agora</button>
  </div>
</header>

<main>

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi" style="--accent:var(--blue)">
      <div class="kpi-lbl">Total de Alunos</div>
      <div class="kpi-val" id="k-total">—</div>
      <div class="kpi-sub">no CRM</div>
    </div>
    <div class="kpi" style="--accent:var(--pos)">
      <div class="kpi-lbl">Finalizados</div>
      <div class="kpi-val" id="k-fin">—</div>
      <div class="kpi-sub" id="k-fin-pct"></div>
    </div>
    <div class="kpi" style="--accent:var(--teal)">
      <div class="kpi-lbl">Contatados</div>
      <div class="kpi-val" id="k-cont">—</div>
      <div class="kpi-sub" id="k-cont-pct"></div>
    </div>
    <div class="kpi" style="--accent:var(--blue-lt)">
      <div class="kpi-lbl">Qtd Depósitos</div>
      <div class="kpi-val" id="k-qtd">—</div>
      <div class="kpi-sub" id="k-qtd-pct"></div>
    </div>
    <div class="kpi" style="--accent:var(--blue-lt)">
      <div class="kpi-lbl">Total Depósitos</div>
      <div class="kpi-val" id="k-total-dep">—</div>
    </div>
    <div class="kpi" style="--accent:var(--blue-lt)">
      <div class="kpi-lbl">Média por Depósito</div>
      <div class="kpi-val" id="k-media">—</div>
    </div>
  </div>

  <!-- Tabela Broker + Gráfico Linha -->
  <div class="row2">
    <div class="card">
      <div class="card-hdr"><h3>Performance por Broker</h3></div>
      <div class="tbl-wrap"><table>
        <thead>
          <tr>
            <th>Broker</th>
            <th class="r">Qtd Dep.</th>
            <th class="r">Total</th>
            <th class="r">Média</th>
          </tr>
        </thead>
        <tbody id="tbl-broker"><tr><td colspan="4" class="empty">Aguardando dados...</td></tr></tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="card-hdr"><h3>Depósitos por Dia</h3></div>
      <div class="card-body"><canvas id="ch-dep-dia"></canvas></div>
    </div>
  </div>

</main>

<script>
const REFRESH_MS = 30_000;
const STALE_MIN  = 10;
let depChart = null;

const usd = v => {
  const n = parseFloat(String(v ?? '').replace(',', '.'));
  return isNaN(n) ? '—' : '$' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const pct  = (a, b) => b ? (a / b * 100).toFixed(2) + '%' : '';
const set  = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v ?? '—'; };

function setStatus(type, txt) {
  document.getElementById('dot').className = type === 'ok' ? '' : type;
  document.getElementById('status-txt').textContent = txt;
}

function renderBroker(por_broker) {
  const tb = document.getElementById('tbl-broker');
  if (!por_broker || !Object.keys(por_broker).length) {
    tb.innerHTML = '<tr><td colspan="4" class="empty">Sem dados</td></tr>';
    return;
  }
  tb.innerHTML = Object.entries(por_broker)
    .sort((a, b) => b[1].total - a[1].total)
    .map(([broker, d]) => `
      <tr>
        <td>${broker}</td>
        <td class="r">${d.qtd}</td>
        <td class="r">${usd(d.total)}</td>
        <td class="r">${usd(d.media)}</td>
      </tr>`).join('');
}

function renderLineChart(dep_por_dia) {
  if (depChart) { depChart.destroy(); depChart = null; }
  if (!dep_por_dia || !Object.keys(dep_por_dia).length) return;

  const entries = Object.entries(dep_por_dia).sort((a, b) => a[0].localeCompare(b[0]));
  const labels  = entries.map(e => {
    const d = new Date(e[0] + 'T12:00:00');
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  });
  const values = entries.map(e => e[1]);

  const ctx = document.getElementById('ch-dep-dia').getContext('2d');
  depChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Depósitos',
        data: values,
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,.12)',
        borderWidth: 2,
        pointBackgroundColor: '#3b82f6',
        pointRadius: 4,
        fill: true,
        tension: .3
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ' ' + ctx.parsed.y + ' depósito(s)'
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#94a3b8', font: { size: 11 } },
          grid:  { color: '#2d3f55' }
        },
        y: {
          ticks: { color: '#94a3b8', font: { size: 11 }, stepSize: 1 },
          grid:  { color: '#2d3f55' },
          beginAtZero: true
        }
      }
    }
  });
}

async function load() {
  document.getElementById('btn').disabled = true;
  try {
    const res = await fetch('./data.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const s = data.summary || {};

    const total = s.total_alunos_crm ?? 0;
    const fin   = s.finalizados ?? 0;
    const cont  = s.contatados  ?? 0;
    const qtd   = s.qtd_depositos ?? 0;

    set('k-total',     total || '—');
    set('k-fin',       fin   || '—');
    set('k-fin-pct',   total ? pct(fin, total)  : '');
    set('k-cont',      cont  || '—');
    set('k-cont-pct',  total ? pct(cont, total) : '');
    set('k-qtd',       qtd   || '—');
    set('k-qtd-pct',   total ? pct(qtd, total)  : '');
    set('k-total-dep', usd(s.total_depositos));
    set('k-media',     usd(s.media_depositos));

    renderBroker(s.por_broker);
    renderLineChart(s.depositos_por_dia);

    if (data.last_updated) {
      const upd = new Date(data.last_updated);
      const age = (Date.now() - upd.getTime()) / 60_000;
      const t   = upd.toLocaleTimeString('pt-BR');
      setStatus(age > STALE_MIN ? 'stale' : 'ok',
        age > STALE_MIN ? `Desatualizado · coleta às ${t}` : `Atualizado às ${t}`);
    } else {
      setStatus('stale', 'Sem dados ainda');
    }
  } catch (e) {
    setStatus('error', 'Erro ao carregar dados');
    console.error(e);
  } finally {
    document.getElementById('btn').disabled = false;
    document.getElementById('loading').classList.add('hidden');
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
